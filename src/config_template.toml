# deew looks for the programs next to the deew executable first, then in your system PATH:
# - ffmpeg, ffprobe
# - the 'dee' folder of the DEE 6.7 tools (dee_ddp_encoder, dee_ddpjoc_encoder, ...)
# - truehdd for ddp-atmos, thd-atmos and ac4-atmos (https://github.com/truehdd/truehdd)
# - harletty for DTS:X and Auro-3D sources (Auro-3D in 24-bit DTS-HD MA, or in FLAC, PCM and TrueHD with a harletty that reads PCM, --codec wav) of ddp-atmos, thd-atmos, ac4-atmos and ac4-ims (https://github.com/harletty/harletty-bridge)
# - dee_shim for ddp-atmos, thd-atmos, TrueHD with DRC none, 7.0 DDP and 7.1 DDP with the standard profile (https://github.com/truehdd/dee-shim)
# Setup instructions: https://github.com/pcrlnd/deew#where-deew-looks-for-the-programs

# If this is empty, 'temp' next to the binary will be used.
# You can also specify an absolute path or a path relative to the current directory.
temp_path = ''

# Set between 1 and 3, use the -pl/--print-logos option to see the available logos, set to 0 to disable logo.
logo = 1

# Specifies how many encodes can run at the same time.
# It can be a number or a % compared to your number of threads (so '50%' means 4 on an 8 thread cpu).
# One DEE can use 2 threads so setting '50%' can utilize all threads.
# You can override this setting with -in/--instances.
# The number will be clamped between 1 and cpu_count().
# examples: 1, 4, '50%'
max_instances = '50%'

# DD/DDP/DDP Atmos: DEE's 90° phase shift on the surround channels, set to false to turn it off (-sps off turns it off for one run, -sps on turns it back on).
surround_phase_shift = true

# DD/DDP: DEE's 120 Hz low-pass filter on the LFE channel, set to false to turn it off (-lpf overrides it for one run).
low_pass_filter = true

# DD/DDP/TrueHD: 3 dB attenuation of the surround channels, set to true to turn it on (-s3a overrides it for one run).
# TrueHD asks first: the output is no longer identical to the source.
surround_3db_attenuation = false

# TrueHD Atmos (truehdd) and DTS:X / Auro-3D (harletty) sources: the warp mode, used only when the source has none: '' (not passed), 'normal', 'warping', 'prologiciix' or 'loro' (-wm overrides it for one run).
truehdd_warp_mode = ''

# TrueHD Atmos sources: truehdd's bed conformance, for sources whose bed comes out as objects, set to true to turn it on (-bc overrides it for one run).
# DTS:X and Auro-3D sources (harletty) are always conformed, this does not change it.
truehdd_bed_conform = false

# Feed the decoded audio from ffmpeg straight into DEE instead of writing a temp .wav (DD, DDP, AC4, AAC, -mo).
# 'auto': always on Linux/macOS; on Windows only when fewer than 2 encodes run at once, because DEE's
#   named pipe is much slower when several encodes run in parallel (those use the temp .wav).
# 'always': always use the pipe.
# false: never use the pipe, set it if the pipe causes problems.
pipe = 'auto'

# Where the encoded files are saved.
# path: the output directory, empty uses the current directory.
#   You can override it with -o/--output.
# to_input: save each output next to its input file, this overrides path.
#   You can turn it on with -oi/--output-to-input.
# template: the name of each output file without the extension (deew adds it).
#   Placeholders: {stem} (the input's name without extension and delay tag),
#   {name} (without extension, delay tag kept), {format} (ddp, thd, ...),
#   {codec} (DDP, TrueHD Atmos, ...), {channels} (2.0, 5.1, 7.1), {bitrate}
#   (kbps, empty for TrueHD), {lang} and {title} (tags of the audio track),
#   {track} (the -ti value). Empty values drop out with a neighbouring
#   separator, e.g. '{stem}.{lang}' gives 'Movie' without a language tag.
#   You can override it with -ot/--output-template, or name a single output
#   with -on/--output-name.
[output]
    path = ''
    to_input = false
    template = '{stem}'

[default_bitrates]
    dd_1_0 = 128
    dd_2_0 = 256
    dd_5_1 = 640
    ddp_1_0 = 128
    ddp_2_0 = 256
    ddp_5_1 = 1024
    ddp_7_1_standard = 1536
    ddp_7_1_bluray = 1536
    ddp_atmos_streaming = 1024
    ddp_atmos_standard = 1536
    ddp_atmos_bluray = 1536
    ac4_2_0 = 256
    ac4_5_1 = 448
    ac4_atmos = 448
    ac4_ims = 256
    aac_2_0 = 256

# The profile used for 7.1 DDP, for DDP Atmos and for AC4 IMS.
# You can override these settings with --ddp-mode, --ddp-atmos-mode and --ac4-ims-mode.
# ddp (7.1 only, 5.1 and below are not affected):
#   standard: E-AC-3 only, 384-1792 kbps, needs dee_shim
#   bluray: AC-3 core + E-AC-3, 768-1664 kbps, also plays on AC-3 only devices
# ddp_atmos (needs truehdd and dee_shim):
#   streaming: 5.1 with Atmos, 384-1024 kbps, the format of streaming services, best device support
#   standard: 7.1 with Atmos, E-AC-3 only, 768-2048 kbps
#   bluray: 7.1 with Atmos, AC-3 core + E-AC-3, 1152-1664 kbps
# ac4_ims:
#   general: the default profile
#   music: no dialogue enhancement, DRC music_light (-r can only be music_light)
# Use -lb/--list-bitrates to see the exact bitrates of each profile.
[default_modes]
    ddp = 'standard' # standard/bluray
    ddp_atmos = 'streaming' # streaming/standard/bluray
    ac4_ims = 'general' # general/music

# You can toggle what sections you would like to see in the encoding summary
[summary_sections]
    deew_info = true
    binaries = true
    input_info = true
    output_info = true
    other = true

# Login for deew-web (the browser version of the GUI).
# Leave both empty to not ask for credentials.
# pass is an argon2 hash, generate it with: deew-web --hash-password
[deew_web]
    user = ''
    pass = ''

# Settings of deew-gui and deew-web:
# progress: 'cli' shows the terminal output of the CLI, 'native' shows progress bars, warnings and pop-up prompts in the window.
# scaling: zoom of the deew-gui window, '80%' to '150%' (deew-web uses the browser's zoom).
# use_system_font: true uses the system's font instead of the bundled IBM Plex Sans.
# theme: 'system' follows the operating system, 'light' or 'dark' (deew-gui; deew-web keeps its own per browser).
# minimum_output_height: the smallest height of the output area (CLI output, progress, utilities) in pixels, the page scrolls when the window is smaller.
# title_bar: 'custom' draws deew-gui's own title bar, 'native' uses the operating system's (deew-gui, restart to apply).
[gui]
    progress = 'cli'
    scaling = '100%'
    use_system_font = false
    theme = 'system'
    minimum_output_height = 320
    title_bar = 'custom'
