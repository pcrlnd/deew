name: Build CLI

env:
  RELEASE_VERSION:

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      copy_gui_and_web:
        description: Copy deew-gui and deew-web from the newest older release that has them
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux-build:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Create changelog file
        run: python -c "print('\n'.join(open('changelog.md', 'r').read().split('\n\n# deew')[0].split('\n')[1:]))" >> changelog.txt

      - name: Fetch changelog and version
        run: |
          version=$(python -c "print(open('changelog.md', 'r').read().split('\n')[0].split(' ')[2].replace(':', ''))")
          changelog=$(cat changelog.txt)
          echo -e "Version: $version\n\nChangelog:\n$changelog"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Move target/x86_64-unknown-linux-musl/release/deew to deew
        run: mv target/x86_64-unknown-linux-musl/release/deew deew

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          body_path: changelog.txt
          files: deew

  windows-build:
    name: Windows
    runs-on: windows-latest
    needs: linux-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch version
        run: |
          $version=$(python -c "print(open('changelog.md', 'r').read().split('\n')[0].split(' ')[2].replace(':', ''))")
          echo "Version: $version"
          echo "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --locked

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: target/release/deew.exe

  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    needs: [linux-build, windows-build]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check version
        run: |
          version=$(python -c "print(open('changelog.md', 'r').read().split('\n')[0].split(' ')[2].replace(':', ''))")
          crate_version=$(cargo metadata --no-deps --format-version 1 | python -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "changelog.md: $version, Cargo.toml: $crate_version"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::Cargo.toml version ($crate_version) doesn't match changelog.md ($version)"
            exit 1
          fi
          echo "CRATE_VERSION=$crate_version" >> "$GITHUB_ENV"

      - name: Check if already published
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'deew release workflow (https://github.com/pcrlnd/deew)' "https://crates.io/api/v1/crates/deew/$CRATE_VERSION")
          case "$status" in
            200)
              echo "deew $CRATE_VERSION is already on crates.io, skipping publish"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP $status"
              exit 1
              ;;
          esac

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  copy-gui-and-web:
    name: Copy GUI and web
    runs-on: ubuntu-latest
    needs: [linux-build, windows-build]
    # The input is absent (null) for repository_dispatch, and null == true is false.
    if: inputs.copy_gui_and_web == true

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Copy release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          files="deew-gui deew-web deew-gui.exe deew-web.exe"

          # Names of the files above that the release has.
          wanted_assets() {
            gh release view "$1" --repo "$repo" --json assets -q '.assets[].name' \
              | grep -Fx $(printf -- '-e %s ' $files) || true
          }

          to=$(python -c "print(open('changelog.md', 'r').read().split('\n')[0].split(' ')[2].replace(':', ''))")
          if [ -z "$to" ]; then
            echo "::error::Could not read the version from changelog.md"
            exit 1
          fi

          # Releases are listed newest first: take the first other one that has the files.
          from=""
          for tag in $(gh release list --repo "$repo" --exclude-drafts --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$tag" != "$to" ] && [ -n "$(wanted_assets "$tag")" ]; then
              from="$tag"
              break
            fi
          done
          if [ -z "$from" ]; then
            echo "::error::No other release with deew-gui or deew-web found"
            exit 1
          fi

          assets=$(wanted_assets "$from")
          for file in $files; do
            echo "$assets" | grep -Fxq "$file" || echo "::warning::Release $from has no $file, skipping it"
          done

          # Never overwrite what the target release already has.
          have=$(wanted_assets "$to")
          copy=""
          for file in $assets; do
            if echo "$have" | grep -Fxq "$file"; then
              echo "Release $to already has $file, skipping it"
            else
              copy="$copy $file"
            fi
          done
          if [ -z "$copy" ]; then
            echo "Nothing to copy to $to"
            exit 0
          fi

          echo "Copying from $from to $to:" $copy
          mkdir dl
          for file in $copy; do
            gh release download "$from" --repo "$repo" --dir dl --pattern "$file"
          done
          gh release upload "$to" dl/* --repo "$repo"

      # Posting is best effort: a failure is logged as a warning, the run stays green.
      - name: Set up Python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.x'

      - name: Install requests
        run: python -m pip install requests || echo "::warning::Installing requests failed"

      - name: Posting changelog to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CH1: ${{ secrets.TG_CH1 }}
          TG_CH2: ${{ secrets.TG_CH2 }}
        run: |
          python dev_scripts/telegram.py "$TG_TOKEN" "$TG_CH1" || echo "::warning::Posting changelog to Telegram (TG_CH1) failed"
          python dev_scripts/telegram.py "$TG_TOKEN" "$TG_CH2" || echo "::warning::Posting changelog to Telegram (TG_CH2) failed"

      - name: Posting changelog to Doom9
        env:
          DOOM9_PASSWORD: ${{ secrets.DOOM9_PASSWORD }}
        run: python dev_scripts/doom9.py "$DOOM9_PASSWORD" || echo "::warning::Posting changelog to Doom9 failed"
