name: Copy GUI and web

on:
  workflow_dispatch:
    inputs:
      from:
        description: Release tag to copy from (empty = newest older release that has them)
        required: false
        type: string
        default: ''
      to:
        description: Release tag to copy to (empty = latest release)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  copy:
    name: Copy deew-gui and deew-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Copy release files
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          repo="$GITHUB_REPOSITORY"
          files="deew-gui deew-web deew-gui.exe deew-web.exe"

          # Names of the files above that the release has.
          wanted_assets() {
            gh release view "$1" --repo "$repo" --json assets -q '.assets[].name' \
              | grep -Fx $(printf -- '-e %s ' $files) || true
          }

          to="$INPUT_TO"
          if [ -z "$to" ]; then
            to=$(gh release view --repo "$repo" --json tagName -q .tagName) || true
          fi
          if [ -z "$to" ]; then
            echo "::error::No release found. Create a release first or pass the to input."
            exit 1
          fi

          from="$INPUT_FROM"
          if [ -z "$from" ]; then
            # Releases are listed newest first: take the first one after the target that has the files.
            seen=false
            for tag in $(gh release list --repo "$repo" --exclude-drafts --limit 100 --json tagName -q '.[].tagName'); do
              if [ "$tag" = "$to" ]; then
                seen=true
              elif $seen && [ -n "$(wanted_assets "$tag")" ]; then
                from="$tag"
                break
              fi
            done
          fi
          if [ -z "$from" ]; then
            echo "::error::No older release with deew-gui or deew-web found. Pass the from input."
            exit 1
          fi
          if [ "$from" = "$to" ]; then
            echo "::error::Source and target release are both $to."
            exit 1
          fi

          assets=$(wanted_assets "$from")
          if [ -z "$assets" ]; then
            echo "::error::Release $from has none of: $files"
            exit 1
          fi
          for file in $files; do
            echo "$assets" | grep -Fxq "$file" || echo "::warning::Release $from has no $file, skipping it"
          done

          echo "Copying from $from to $to:" $assets
          mkdir dl
          for file in $assets; do
            gh release download "$from" --repo "$repo" --dir dl --pattern "$file"
          done
          gh release upload "$to" dl/* --repo "$repo" --clobber

      # Posting is best effort: a failure is logged as a warning, the run stays green.
      - name: Set up Python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.x'

      - name: Install requests
        run: python -m pip install requests || echo "::warning::Installing requests failed"

      - name: Posting changelog to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CH1: ${{ secrets.TG_CH1 }}
          TG_CH2: ${{ secrets.TG_CH2 }}
        run: |
          python dev_scripts/telegram.py "$TG_TOKEN" "$TG_CH1" || echo "::warning::Posting changelog to Telegram (TG_CH1) failed"
          python dev_scripts/telegram.py "$TG_TOKEN" "$TG_CH2" || echo "::warning::Posting changelog to Telegram (TG_CH2) failed"

      - name: Posting changelog to Doom9
        env:
          DOOM9_PASSWORD: ${{ secrets.DOOM9_PASSWORD }}
        run: python dev_scripts/doom9.py "$DOOM9_PASSWORD" || echo "::warning::Posting changelog to Doom9 failed"
