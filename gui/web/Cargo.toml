[package]
name = "deew-web"
version = "0.3.0"
description = "Browser version of the deew GUI: serves the frontend and runs the deew CLI"
authors = ["pcroland <pcroland@protonmail.ch>"]
license = "MIT"
repository = "https://github.com/pcrlnd/deew"
edition = "2024"
build = "build.rs"

[lib]
name = "deew_web"

[[bin]]
name = "deew-web"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
deew-gui-core = { version = "0.1.0", path = "../core" }
dunce = "1.0.5"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
toml = "1.1.8"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
