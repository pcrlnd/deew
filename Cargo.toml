[package]
name = "deew"
version = "3.6.1"
edition = "2024"
description = "Dolby Encoding Engine Wrapper"
license = "MIT"
authors = ["pcroland <pcroland@protonmail.ch>"]
repository = "https://github.com/pcrlnd/deew"
homepage = "https://deew.dev"
readme = "README.md"
keywords = ["dolby", "audio", "encoder", "ac3", "eac3"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.85"
include = ["/src", "/build.rs", "/logo/icon.ico", "/README.md", "/LICENSE", "/changelog.md"]

[dependencies]
base64 = "0.23.1"
console = "0.16.6"
deunicode = "1.6.2"
indicatif = "0.18.6"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.3"
ureq = "3.5.0"
which = "8.0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/deew"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/deew"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/deew.exe"
pkg-fmt = "bin"
